# Times the container on an x86-64 Linux runner: builds the image, generates a dataset, runs with the scorer's flags.
name: bench
on:
  workflow_dispatch:
    inputs:
      events:
        description: number of events to generate
        default: "10000000"
      seed:
        description: generator seed
        default: "7"
      compare:
        description: optional second commit to build and time on the same runner
        default: ""
      envs:
        description: semicolon-separated env settings, each run natively under perf stat
        default: ""
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CPU info
        run: lscpu | head -20; nproc; free -g; cat /sys/kernel/mm/transparent_hugepage/enabled
      - name: Build image
        run: docker build -t shopsess:ci .
      - name: Build comparison image
        if: ${{ github.event.inputs.compare != '' }}
        run: |
          rm -rf /tmp/cmp && git worktree add /tmp/cmp ${{ github.event.inputs.compare }}
          docker build -t shopsess:cmp /tmp/cmp
      - name: Build generator
        run: cd tools/generator && cargo build --release
      - name: Generate data
        run: |
          mkdir -p /tmp/data /tmp/out /tmp/scratch && chmod 777 /tmp/out /tmp/scratch
          tools/generator/target/release/generate --seed ${{ github.event.inputs.seed }} --events ${{ github.event.inputs.events }} --clicks $(( ${{ github.event.inputs.events }} / 4 )) --output /tmp/data
          du -sh /tmp/data
      - name: Warm page cache
        run: cat /tmp/data/events/*.csv /tmp/data/clicks/*.csv /tmp/data/links/*.csv > /dev/null
      - name: Run 3 times (fork on)
        run: |
          for i in 1 2 3; do
            sudo rm -rf /tmp/out/*
            /usr/bin/time -f "wall %e s, maxrss %M KB" docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 --cpus 4 --memory 12g --memory-swap 12g \
              --user 1000:1000 -v /tmp/data:/data:ro -v /tmp/out:/output -v /tmp/scratch:/scratch \
              -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch -e NCPU=4 -e MEM_GB=12 shopsess:ci
          done
      - name: Comparison image, 3 runs (same runner)
        if: ${{ github.event.inputs.compare != '' }}
        run: |
          for i in 1 2 3; do
            sudo rm -rf /tmp/out/*
            /usr/bin/time -f "wall %e s" docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 --cpus 4 --memory 12g --memory-swap 12g \
              --user 1000:1000 -v /tmp/data:/data:ro -v /tmp/out:/output -v /tmp/scratch:/scratch \
              -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch -e NCPU=4 -e MEM_GB=12 shopsess:cmp 2>&1 | sed 's/^/CMP /'
          done
      - name: Run with NCPU=8 (oversubscribed) and with NO_FORK
        run: |
          sudo rm -rf /tmp/out/*
          /usr/bin/time -f "wall %e s" docker run --rm --network none --cpus 4 --memory 12g --user 1000:1000 \
            -v /tmp/data:/data:ro -v /tmp/out:/output -e DATA_DIR=/data -e OUTPUT_DIR=/output -e NCPU=8 shopsess:ci
          sudo rm -rf /tmp/out/*
          /usr/bin/time -f "wall %e s" docker run --rm --network none --cpus 4 --memory 12g --user 1000:1000 \
            -v /tmp/data:/data:ro -v /tmp/out:/output -e DATA_DIR=/data -e OUTPUT_DIR=/output -e NO_FORK=1 -e NCPU=4 shopsess:ci
      - name: Run with USE_MMAP=1
        run: |
          sudo rm -rf /tmp/out/*
          /usr/bin/time -f "wall %e s" docker run --rm --network none --cpus 4 --memory 12g --user 1000:1000 \
            -v /tmp/data:/data:ro -v /tmp/out:/output -e DATA_DIR=/data -e OUTPUT_DIR=/output -e NCPU=4 -e USE_MMAP=1 shopsess:ci
      - name: Dedup isolation (skip emit / skip candidates)
        run: |
          for v in DEDUP_SKIP_EMIT DEDUP_SKIP_CANDS; do
            sudo rm -rf /tmp/out/*
            docker run --rm --network none --cpus 4 --memory 12g --user 1000:1000 \
              -v /tmp/data:/data:ro -v /tmp/out:/output -e DATA_DIR=/data -e OUTPUT_DIR=/output -e NCPU=4 -e $v=1 shopsess:ci 2>&1 | grep -E "dedup" | sed "s/^/$v: /"
          done
      - name: Single-thread parse stage breakdown (BENCH=1)
        run: |
          docker run --rm --network none --cpus 4 --memory 12g --user 1000:1000 \
            -v /tmp/data:/data:ro -v /tmp/out:/output -e DATA_DIR=/data -e OUTPUT_DIR=/output -e BENCH=1 -e NO_FORK=1 -e NCPU=1 shopsess:ci
          echo "--- without AVX-512 ---"
          docker run --rm --network none --cpus 4 --memory 12g --user 1000:1000 \
            -v /tmp/data:/data:ro -v /tmp/out:/output -e DATA_DIR=/data -e OUTPUT_DIR=/output -e BENCH=1 -e NO_FORK=1 -e NCPU=1 -e NO_AVX512=1 shopsess:ci
      - name: perf stat and hot symbols (native binary, outside docker)
        run: |
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || true
          docker create --name tmpc shopsess:ci && docker cp tmpc:/shopsess /tmp/shopsess && docker rm tmpc >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null || true
          sudo rm -rf /tmp/out/* ; mkdir -p /tmp/out2
          DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/out2 NCPU=4 NO_FORK=1 perf stat -e task-clock,cycles,instructions,branches,branch-misses,cache-misses,LLC-load-misses,page-faults /tmp/shopsess 2>&1 | tail -25 || true
          rm -rf /tmp/out2; mkdir -p /tmp/out2
          DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/out2 NCPU=4 NO_FORK=1 perf record -q -F 2000 -g -o /tmp/perf.data /tmp/shopsess 2>/dev/null || true
          perf report -i /tmp/perf.data --no-children --sort symbol --stdio 2>/dev/null | grep -vE "^#|^$" | head -40 || true
      - name: Native timing of main vs comparison binary (process exit included, docker excluded)
        if: ${{ github.event.inputs.compare != '' }}
        run: |
          docker create --name tmpc2 shopsess:cmp && docker cp tmpc2:/shopsess /tmp/shopsess_cmp && docker rm tmpc2 >/dev/null
          docker create --name tmpc3 shopsess:ci && docker cp tmpc3:/shopsess /tmp/shopsess_main && docker rm tmpc3 >/dev/null
          for b in main cmp main cmp; do
            sudo rm -rf /tmp/out3; mkdir -p /tmp/out3
            echo "=== native $b ==="
            DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/out3 NCPU=4 NO_FORK=1 /usr/bin/time -f "elapsed %e s, sys %S s" /tmp/shopsess_$b 2>&1 | grep -E "wrote|elapsed"
            du -sh /tmp/out3 | cut -f1
          done
      - name: Output on tmpfs vs bind mount (main and comparison images)
        if: ${{ github.event.inputs.compare != '' }}
        run: |
          for img in ci cmp ci cmp; do
            echo "=== $img, output on tmpfs ==="
            /usr/bin/time -f "wall %e s" docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m --cpus 4 --memory 12g --user 1000:1000 \
              -v /tmp/data:/data:ro -e DATA_DIR=/data -e OUTPUT_DIR=/tmp/o -e NCPU=4 shopsess:$img 2>&1 | grep -E "wrote|wall"
            sudo rm -rf /tmp/out/*
            echo "=== $img, output on bind mount ==="
            /usr/bin/time -f "wall %e s" docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m --cpus 4 --memory 12g --user 1000:1000 \
              -v /tmp/data:/data:ro -v /tmp/out:/output -e DATA_DIR=/data -e OUTPUT_DIR=/output -e NCPU=4 shopsess:$img 2>&1 | grep -E "wrote|wall"
          done
      - name: Env experiments (native, perf stat)
        if: ${{ github.event.inputs.envs != '' }}
        run: |
          IFS=';' read -ra SETS <<< "${{ github.event.inputs.envs }}"
          for e in "" "${SETS[@]}"; do
            for i in 1 2; do
              rm -rf /tmp/out2; mkdir -p /tmp/out2
              echo "=== env [$e] run $i ==="
              env $e DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/out2 NCPU=4 NO_FORK=1 perf stat -e task-clock,page-faults /tmp/shopsess 2>&1 | grep -E "wrote|page-faults|seconds (user|sys|time)"
            done
          done
      - name: Container overhead of our image (EXIT_NOW, scorer flags, warm)
        run: |
          for i in 1 2 3 4; do
            /usr/bin/time -f "overhead wall %e s" docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 --cpus 4 --memory 12g --memory-swap 12g \
              --user 1000:1000 -v /tmp/data:/data:ro -v /tmp/out:/output -v /tmp/scratch:/scratch -e EXIT_NOW=1 shopsess:ci
          done
      - name: Empty-container baseline
        run: /usr/bin/time -f "docker run overhead %e s" docker run --rm --network none alpine true
